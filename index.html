<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Taller | Saurondroner</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      background: #1c1c1c;
      padding: 30px 20px;
      text-align: center;
      border-bottom: 2px solid #333;
    }

    header h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    header p {
      color: #bbb;
      font-size: 18px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    h2 {
      margin-bottom: 25px;
      font-size: 30px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .project {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 25px;
    }

    .project h3 {
      font-size: 23px;
      margin-bottom: 12px;
    }

    .project p {
      color: #bbb;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .buttons a {
      display: inline-block;
      background: #333;
      color: white;
      text-decoration: none;
      padding: 10px 15px;
      border-radius: 7px;
      margin-right: 5px;
      margin-bottom: 5px;
    }

    .buttons a:hover {
      background: #555;
    }

    footer {
      text-align: center;
      padding: 30px;
      margin-top: 40px;
      background: #1c1c1c;
      color: #888;
    }
  </style>
</head>

<body>

  <header>
    <h1>🛠️ EL TALLER</h1>
    <p>Proyectos, experimentos y cosas que voy aprendiendo</p>
  </header>

  <main class="container">

    <h2>🚀 Mis proyectos</h2>

    <div class="projects">

      <div class="project">
        <h3>💡 Lámpara RGB con Arduino</h3>

        <p>
          Mi primer proyecto aprendiendo Arduino desde cero.
          Una lámpara RGB controlada mediante sensores de luz.
        </p>

        <div class="buttons">
          <a href="https://github.com/Saurondroner/lampara-rgb-arduino">
            📁 Proyecto
          </a>

          <a href="https://github.com/Saurondroner/lampara-rgb-arduino/blob/main/lampara_rgb.ino">
            💻 Código
          </a>

          <a href="https://www.youtube.com/@saurondroner">
            🎥 YouTube
          </a>
        </div>
      </div>

    </div>

  </main>

  <footer>
    🛠️ El Taller · Saurondroner
  </footer>

</body>
</html>
